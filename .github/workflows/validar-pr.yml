name: Validación de Pull Request

on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, synchronize ]

jobs:
  vincular-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar palabra clave de cierre
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const patron = /(closes|fixes|resolves|cierra|resuelve)\s+#\d+/i;
            if (!patron.test(body)) {
              core.setFailed('El PR debe incluir "Closes #<número de Issue>" o equivalente en su descripción.');
            } else {
              core.info('Vínculo con Issue verificado correctamente.');
            }